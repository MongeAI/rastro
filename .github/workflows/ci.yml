name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      # interface de ponta a ponta no Chrome que já vem no ubuntu-latest
      - run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm pack --dry-run -w apps/cli
