name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      # o Rastro confere a própria arquitetura (rastro.rules.json)
      - run: node apps/cli/bin/rastro.js check
      # interface de ponta a ponta no Chrome que já vem no ubuntu-latest
      - run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm pack --dry-run -w apps/cli

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # projetos sintéticos de 100, 1000 e 5000 arquivos; falha se passar dos limites
      - run: node scripts/bench.mjs 100 1000 5000 --check
