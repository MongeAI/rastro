name: Rastro impact
description: >-
  Comments on every pull request what the change affects (proven calls, imports, routes and tests to run)
  and attaches an offline interactive map. Static analysis only: no code from the repository is executed.
author: MongeAI
branding:
  icon: git-pull-request
  color: gray-dark

inputs:
  path:
    description: Project folder to analyze, relative to the repository root.
    default: .
  base:
    description: Branch to compare against. Default is the pull request's base branch.
    default: ''
  exclude:
    description: Paths to ignore, one per line (.gitignore syntax).
    default: ''
  comment:
    description: Post the impact as a pull request comment (updated on every push; one comment per analyzed path).
    default: 'true'
  comment-author:
    description: Login that posts the comment (to find and update it). Change it when using a custom token.
    default: github-actions[bot]
  report:
    description: Upload the offline interactive HTML report as a workflow artifact.
    default: 'true'
  artifact-name:
    description: Name of the report artifact (use a different one per call when running the action more than once in a workflow).
    default: rastro-report
  lang:
    description: Language of the comment and report (en or pt).
    default: en
  version:
    description: Version of @mongeai/rastro to run.
    default: 0.2.0
  github-token:
    description: Token used to comment on the pull request.
    default: ${{ github.token }}

outputs:
  tests:
    description: Test files that changed or depend on what changed, one per line (relative to the workspace).
    value: ${{ steps.impact.outputs.tests }}
  impacted:
    description: How many entities could be affected.
    value: ${{ steps.impact.outputs.impacted }}
  changed:
    description: How many entities changed.
    value: ${{ steps.impact.outputs.changed }}
  markdown:
    description: Path of the Markdown report.
    value: ${{ steps.impact.outputs.markdown }}
  json:
    description: Path of the JSON report.
    value: ${{ steps.impact.outputs.json }}

runs:
  using: composite
  steps:
    # usa o Node do runner quando ele já serve (≥ 22.12): instalar outro trocaria o Node dos
    # passos seguintes do job
    - id: node
      shell: bash
      run: |
        if node -e 'const [a, b] = process.versions.node.split(".").map(Number); process.exit(a > 22 || (a === 22 && b >= 12) ? 0 : 1)' 2>/dev/null; then
          echo "ok=true" >>"$GITHUB_OUTPUT"
        else
          echo "ok=false" >>"$GITHUB_OUTPUT"
        fi

    - if: steps.node.outputs.ok != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 22
        package-manager-cache: false

    - id: impact
      shell: bash
      env:
        RASTRO_PATH: ${{ inputs.path }}
        RASTRO_BASE: ${{ inputs.base }}
        RASTRO_EXCLUDE: ${{ inputs.exclude }}
        RASTRO_LANG: ${{ inputs.lang }}
        RASTRO_VERSION: ${{ inputs.version }}
        RASTRO_REPORT: ${{ inputs.report }}
        # o commit dos links é o do checkout (lido pelo script), de onde vêm as linhas
        RASTRO_REPO_URL: https://github.com/${{ github.repository }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/impact.sh"

    - id: upload
      if: inputs.report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.impact.outputs.dir }}/rastro-report.html
        retention-days: 14

    - if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RASTRO_MARKDOWN: ${{ steps.impact.outputs.markdown }}
        RASTRO_PATH: ${{ inputs.path }}
        RASTRO_REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        RASTRO_LANG: ${{ inputs.lang }}
        RASTRO_AUTHOR: ${{ inputs.comment-author }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/comment.sh"
